<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple Calculator</title>

    <style>
        /* Style the whole page */
        body {
            font-family: Arial, sans-serif;
            background-color: #eaf0ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Style the calculator box */
        .calculator {
            background-color: white;
            padding: 20px;
            border-radius: 12px;
            width: 280px;
            box-shadow: 0 4px 15px #ccd3e0;
        }

        h2 {
            text-align: center;
            color: #174ea6;
        }

        /* Style the display */
        #display {
            width: 100%;
            box-sizing: border-box;
            padding: 15px;
            margin-bottom: 15px;
            font-size: 24px;
            text-align: right;
        }

        /* Arrange the buttons in a grid */
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        button {
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 6px;
            background-color: #e6edff;
            cursor: pointer;
        }

        button:hover {
            background-color: #cbdcff;
        }

        .operator {
            background-color: #bcd2ff;
        }

        .equal {
            background-color: #1769ff;
            color: white;
        }

        .clear {
            background-color: #ffd8d8;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h2>Simple Calculator</h2>

        <!-- Screen where numbers and results appear -->
        <input type="text" id="display" value="0" readonly>

        <!-- Calculator buttons -->
        <div class="buttons">

            <button onclick="clearDisplay()" class="clear">C</button>
            <button onclick="chooseOperator('/')" class="operator">÷</button>
            <button onclick="chooseOperator('*')" class="operator">×</button>
            <button onclick="chooseOperator('-')" class="operator">−</button>

            <button onclick="addNumber('7')">7</button>
            <button onclick="addNumber('8')">8</button>
            <button onclick="addNumber('9')">9</button>
            <button onclick="chooseOperator('+')" class="operator">+</button>

            <button onclick="addNumber('4')">4</button>
            <button onclick="addNumber('5')">5</button>
            <button onclick="addNumber('6')">6</button>
            <button onclick="calculate()" class="equal">=</button>

            <button onclick="addNumber('1')">1</button>
            <button onclick="addNumber('2')">2</button>
            <button onclick="addNumber('3')">3</button>
            <button onclick="addNumber('0')">0</button>

            <button onclick="addNumber('.')">.</button>

        </div>

    </div>

    <script>
        // Variables used by the calculator
        let firstNumber = null;
        let operator = "";
        let waitingForSecondNumber = false;

        // Add a number to the display
        function addNumber(number) {
            const display = document.getElementById("display");

            if (display.value === "Error") {
                display.value = "0";
            }

            if (waitingForSecondNumber) {
                display.value = number === "." ? "0." : number;
                waitingForSecondNumber = false;
                return;
            }

            if (number === "." && display.value.includes(".")) {
                return;
            }

            if (display.value === "0" && number !== ".") {
                display.value = number;
            } else {
                display.value += number;
            }
        }

        // Remember the selected operation
        function chooseOperator(selectedOperator) {
            const display = document.getElementById("display");

            if (display.value === "Error") return;

            if (operator !== "" && !waitingForSecondNumber) {
                calculate();
            }

            firstNumber = Number(display.value);
            operator = selectedOperator;
            waitingForSecondNumber = true;
        }

        // Perform the calculation
        function calculate() {
            const display = document.getElementById("display");

            if (operator === "" || waitingForSecondNumber) {
                return;
            }

            const secondNumber = Number(display.value);
            let result;

            switch (operator) {
                case "+":
                    result = firstNumber + secondNumber;
                    break;

                case "-":
                    result = firstNumber - secondNumber;
                    break;

                case "*":
                    result = firstNumber * secondNumber;
                    break;

                case "/":
                    if (secondNumber === 0) {
                        display.value = "Error";
                        operator = "";
                        waitingForSecondNumber = true;
                        return;
                    }

                    result = firstNumber / secondNumber;
                    break;
            }

            display.value = String(Number(result.toPrecision(10)));

            firstNumber = null;
            operator = "";
            waitingForSecondNumber = true;
        }

        // Clear the calculator
        function clearDisplay() {
            document.getElementById("display").value = "0";

            firstNumber = null;
            operator = "";
            waitingForSecondNumber = false;
        }
    </script>

</body>
</html>
